version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bd_cod_landing_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://coduser:codpass@db:3306/cod_landing_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bd_cod_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpass
      MYSQL_DATABASE: cod_landing_db
      MYSQL_USER: coduser
      MYSQL_PASSWORD: codpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
